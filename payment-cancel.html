<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ការបង់ប្រាក់ត្រូវបានលុបចោល | Oneday Clothing</title>
    <link rel="icon" type="image/png" href="images/oneday_clothing_logo_180x180.png">
    <style>
        :root { --bg:#f8fafc; --fg:#0f172a; --card:#ffffff; --muted:#64748b; --accent:#0f172a; --danger:#dc2626; }
        @media (prefers-color-scheme: dark) {
            :root { --bg:#0f172a; --fg:#f8fafc; --card:#1e293b; --muted:#94a3b8; --accent:#f8fafc; --danger:#f87171; }
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
               background:var(--bg); color:var(--fg); font-family:'Khmer OS Battambang','Noto Sans Khmer',-apple-system,Segoe UI,sans-serif; }
        .card { background:var(--card); max-width:380px; width:100%; padding:32px 24px; border-radius:20px; text-align:center;
                box-shadow:0 10px 30px rgba(0,0,0,.08); }
        .icon { width:72px; height:72px; margin:0 auto 16px; border-radius:50%; background:color-mix(in srgb,var(--danger) 15%,transparent);
                color:var(--danger); font-size:38px; display:flex; align-items:center; justify-content:center; }
        h1 { font-size:20px; margin-bottom:8px; }
        p { color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:24px; }
        a.btn { display:block; padding:14px; border-radius:12px; background:var(--accent); color:var(--bg); text-decoration:none; font-weight:600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✕</div>
        <h1>ការបង់ប្រាក់ត្រូវបានលុបចោល</h1>
        <p>អ្នកមិនទាន់បានបង់ប្រាក់ទេ ហើយគ្មានការកាត់ប្រាក់ពីគណនីរបស់អ្នកឡើយ។<br>អ្នកអាចត្រឡប់ទៅហាង ហើយកុម្មង់ម្តងទៀតបានគ្រប់ពេល។<br><br>Payment cancelled. You have not been charged.</p>
        <a class="btn" href="/">ត្រឡប់ទៅហាង / Back to shop</a>
    </div>
</body>
</html>
